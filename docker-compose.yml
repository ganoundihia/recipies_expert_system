services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chef
      POSTGRES_PASSWORD: chef
      POSTGRES_DB: pantry_chef
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chef -d pantry_chef"]
      interval: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://chef:chef@db:5432/pantry_chef
      # LLM_API_KEY and ADMIN_TOKEN come from your shell or a .env file next to this compose file.
      LLM_API_KEY: ${LLM_API_KEY:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me-admin}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
