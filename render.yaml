# One-click deploy on Render (https://render.com): New > Blueprint > select this repository.
services:
  - type: web
    name: pantry-chef
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LLM_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pantry-chef-db
          property: connectionString

databases:
  - name: pantry-chef-db
    plan: free
